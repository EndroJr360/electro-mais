<!doctype html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loja — Electro Mais</title><meta name="theme-color" content="#f58220"><style>
:root{--o:#f58220;--d:#111827;--m:#64748b;--bg:#f5f7fa;--line:#e5e7eb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 5px 20px #0f172a0b}.nav{max-width:1160px;margin:auto;min-height:72px;padding:10px 18px;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;object-fit:contain}.brand{display:flex;flex-direction:column;line-height:1.1}.brand strong{font-size:18px}.brand small{font-size:10px;color:#c66b16;margin-top:5px}.back{margin-left:auto;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.wrap{max-width:1160px;margin:auto;padding:30px 18px 70px}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:24px;padding:30px;margin-bottom:22px}.hero .kicker{font-size:11px;font-weight:900;letter-spacing:2px;color:#f9b36f}.hero h1{margin:6px 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:#e5e7eb;max-width:760px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:13px;border-radius:18px;box-shadow:0 8px 28px #0f172a0a;margin-bottom:18px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{border:1px solid #d8dee7;border-radius:11px;padding:11px 12px;outline:none;background:#fff}.toolbar input{flex:1;min-width:220px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900}.primary{background:var(--o);color:#fff}.dark{background:#172033;color:#fff}.outline{background:#fff;color:#172033;border:1px solid #d9dee7}.muted{color:var(--m)}.status{font-size:13px;color:var(--m);margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 8px 28px #0f172a0a}.card h2,.card h3{margin-top:0}.tag{display:inline-flex;background:#fff3e8;color:#c2410c;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{padding:30px;text-align:center;border:1px dashed #cbd5e1;border-radius:16px;color:var(--m);grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:110px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border-left:3px solid var(--o);font-size:12px;color:#7c2d12}.footer{max-width:1160px;margin:auto;padding:20px 18px 45px;color:#64748b;font-size:11px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:540px){.wrap{padding:18px 11px 50px}.hero{border-radius:18px;padding:24px 19px}.grid{grid-template-columns:1fr}.back{padding:9px 11px}.toolbar{padding:10px}.toolbar input{min-width:100%}}
</style></head><body><header class="top"><div class="nav"><a href="index.html"><img class="logo" src="https://endrojr360.github.io/electro-mais/assets/logo.png" onerror="this.style.display='none'" alt="Electro Mais"></a><a class="brand" href="index.html"><strong>ELECTRO MAIS</strong><small>ONDE A ENERGIA ENCONTRA A QUALIDADE</small></a><a class="back" href="index.html">← Voltar</a></div></header><main class="wrap"><section class="hero"><div class="kicker">MARKETPLACE ELECTRO MAIS</div><h1>Loja</h1><p>Materiais e equipamentos elétricos. Preços de referência em MT; confirme marca, stock e preço final antes da compra.</p></section><div class="toolbar"><input id="q" placeholder="🔎 Procurar produto"><select id="cat"><option value="">Todas categorias</option></select><button class="btn dark" id="cartBtn">Carrinho (<span id="count">0</span>)</button></div><section class="grid" id="grid"></section><section class="card" id="cart" style="margin-top:18px;display:none"><h2>Seu carrinho</h2><div id="items"></div><p><strong>Total: <span id="total">0</span> MT</strong></p><button class="btn primary" id="checkout">Finalizar pedido</button><p id="msg" class="status"></p></section></main><footer class="footer">Electro Mais Moçambique · Onde a Energia Encontra a Qualidade.</footer><script type="module">const firebaseConfig={apiKey:'AIzaSyBR3l3CxiWXv7ZEriIMo833p8oWJ_mTw74',authDomain:'electro-mais-mocambique.firebaseapp.com',projectId:'electro-mais-mocambique',storageBucket:'electro-mais-mocambique.firebasestorage.app',messagingSenderId:'620596361441',appId:'1:620596361441:web:fadde283aa7978c2585fa0',measurementId:'G-YNYY117RKE'};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,addDoc,collection}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});const products=[{"name": "Lâmpada LED 10W", "cat": "Iluminação", "desc": "Modelo LED de uso residencial.", "price": 300, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/LED-E27-Light-Bulb-1134-cropped.jpg"}, {"name": "Lâmpada LED Smart 9W", "cat": "Iluminação inteligente", "desc": "Referência de lâmpada inteligente 9W.", "price": 499, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/LED-E27-Light-Bulb-1134-cropped.jpg"}, {"name": "Tomada Schuko 16A", "cat": "Tomadas", "desc": "Tomada de parede com ligação à terra.", "price": 120, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Electrical_Outlet.jpg"}, {"name": "Interruptor simples", "cat": "Interruptores", "desc": "Interruptor residencial de parede.", "price": 100, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Saklar_Tunggal_AC_220_Volt.jpg"}, {"name": "Comutador simples Legrand", "cat": "Interruptores", "desc": "Referência de mercado para acabamento residencial.", "price": 360, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/BTicino_Magic_electrical_socket_and_switches_1980s_installation.jpg"}, {"name": "Disjuntor 16A", "cat": "Proteção", "desc": "Disjuntor unipolar para proteção de circuitos.", "price": 250, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Circuit_breaker%2C_Single_pole%2C_Non-tripfree%2C_20Amp-30Volts%2C_AN_3160_pic4.JPG"}, {"name": "Contactor 25A 220V", "cat": "Comando e controlo", "desc": "Contactor para aplicações de comando elétrico.", "price": 715, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Contactor_assembled_%2832607700452%29.jpg"}, {"name": "Cabo elétrico 1mm²", "cat": "Cabos", "desc": "Referência de preço por metro.", "price": 90, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Coated_VN_2.jpg"}, {"name": "Cabo solar 6mm²", "cat": "Solar", "desc": "Referência de preço por metro para cabo solar.", "price": 240, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Copper_cable_5G16.JPG"}, {"name": "Caixa de aparelhagem funda", "cat": "Caixas e acessórios", "desc": "Caixa para instalação elétrica.", "price": 20, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Junction_box.jpg"}, {"name": "Alicate de pontas", "cat": "Ferramentas", "desc": "Ferramenta para trabalhos elétricos.", "price": 520, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/160_Year_Klein_Tools_Pliers.png"}, {"name": "Barra de junção 25mm", "cat": "Acessórios", "desc": "Acessório para ligações elétricas.", "price": 170, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Junction_Box.png"}, {"name": "Luminária LED 200W", "cat": "Iluminação pública", "desc": "Referência para iluminação exterior.", "price": 4125, "img": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Led_streetlight.jpg"}];let cart=JSON.parse(localStorage.getItem('electroCart')||'[]'),me=null;onAuthStateChanged(auth,u=>me=u);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value;document.getElementById('grid').innerHTML=products.filter(p=>(!cat||p.cat===cat)&&(`${p.name} ${p.cat} ${p.desc}`).toLowerCase().includes(q)).map((p,i)=>`<article class="card"><img src="${p.img}" alt="${esc(p.name)}" style="width:100%;height:165px;object-fit:contain;background:#f8fafc;border-radius:14px"><span class="tag">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="muted">${esc(p.desc)}</p><strong style="color:var(--o);font-size:19px">${p.price.toLocaleString('pt-MZ')} MT</strong><div class="actions"><button class="btn primary" onclick="add(${i})">Adicionar</button></div></article>`).join('')||'<div class="empty">Nenhum produto encontrado.</div>';renderCart()}products.forEach(p=>{if(![...document.getElementById('cat').options].some(o=>o.value===p.cat))document.getElementById('cat').insertAdjacentHTML('beforeend',`<option>${esc(p.cat)}</option>`)});window.add=i=>{const p=products[i],x=cart.find(x=>x.product===p.name);if(x)x.qty++;else cart.push({product:p.name,price:p.price,qty:1});localStorage.setItem('electroCart',JSON.stringify(cart));renderCart()};function renderCart(){document.getElementById('count').textContent=cart.reduce((a,x)=>a+x.qty,0);document.getElementById('items').innerHTML=cart.map((x,i)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee"><span>${esc(x.product)} × ${x.qty}</span><span>${(x.price*x.qty).toLocaleString('pt-MZ')} MT <button class="btn outline" onclick="removeItem(${i})">−</button></span></div>`).join('')||'<p class="muted">Carrinho vazio.</p>';document.getElementById('total').textContent=cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString('pt-MZ')}window.removeItem=i=>{cart.splice(i,1);localStorage.setItem('electroCart',JSON.stringify(cart));renderCart()};document.getElementById('cartBtn').onclick=()=>{const c=document.getElementById('cart');c.style.display=c.style.display==='none'?'block':'none'};document.getElementById('q').oninput=render;document.getElementById('cat').onchange=render;document.getElementById('checkout').onclick=async()=>{if(!me){location.href='index.html#minha-conta';return}if(!cart.length)return;const msg=document.getElementById('msg');msg.textContent='A preparar pedido…';try{const total=cart.reduce((a,x)=>a+x.price*x.qty,0);await addDoc(collection(db,'orders'),{customerUid:me.uid,items:cart,total,status:'novo',source:'Electro Mais Loja',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});cart=[];localStorage.setItem('electroCart','[]');renderCart();msg.textContent='Pedido criado. Consulte a área de compras para acompanhar o estado.'}catch(e){console.error(e);msg.textContent='Não foi possível criar o pedido. Verifique as regras do Firestore.'}};render();</script></body></html>
