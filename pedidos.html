<!doctype html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meus Pedidos — Electro Mais</title><meta name="theme-color" content="#f58220"><style>
:root{--o:#f58220;--d:#111827;--m:#64748b;--bg:#f5f7fa;--line:#e5e7eb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 5px 20px #0f172a0b}.nav{max-width:1160px;margin:auto;min-height:72px;padding:10px 18px;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;object-fit:contain}.brand{display:flex;flex-direction:column;line-height:1.1}.brand strong{font-size:18px}.brand small{font-size:10px;color:#c66b16;margin-top:5px}.back{margin-left:auto;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.wrap{max-width:1160px;margin:auto;padding:30px 18px 70px}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:24px;padding:30px;margin-bottom:22px}.hero .kicker{font-size:11px;font-weight:900;letter-spacing:2px;color:#f9b36f}.hero h1{margin:6px 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:#e5e7eb;max-width:760px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:13px;border-radius:18px;box-shadow:0 8px 28px #0f172a0a;margin-bottom:18px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{border:1px solid #d8dee7;border-radius:11px;padding:11px 12px;outline:none;background:#fff}.toolbar input{flex:1;min-width:220px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900}.primary{background:var(--o);color:#fff}.dark{background:#172033;color:#fff}.outline{background:#fff;color:#172033;border:1px solid #d9dee7}.muted{color:var(--m)}.status{font-size:13px;color:var(--m);margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 8px 28px #0f172a0a}.card h2,.card h3{margin-top:0}.tag{display:inline-flex;background:#fff3e8;color:#c2410c;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{padding:30px;text-align:center;border:1px dashed #cbd5e1;border-radius:16px;color:var(--m);grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:110px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border-left:3px solid var(--o);font-size:12px;color:#7c2d12}.footer{max-width:1160px;margin:auto;padding:20px 18px 45px;color:#64748b;font-size:11px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:540px){.wrap{padding:18px 11px 50px}.hero{border-radius:18px;padding:24px 19px}.grid{grid-template-columns:1fr}.back{padding:9px 11px}.toolbar{padding:10px}.toolbar input{min-width:100%}}
</style></head><body><header class="top"><div class="nav"><a href="index.html"><img class="logo" src="https://endrojr360.github.io/electro-mais/assets/logo.png" onerror="this.style.display='none'" alt="Electro Mais"></a><a class="brand" href="index.html"><strong>ELECTRO MAIS</strong><small>ONDE A ENERGIA ENCONTRA A QUALIDADE</small></a><a class="back" href="index.html">← Voltar</a></div></header><main class="wrap"><section class="hero"><div class="kicker">PEDIDOS DE SERVIÇO</div><h1>Meus Pedidos</h1><p>Veja pedidos enviados e, quando for técnico, avalie pedidos recebidos e aceite ou recuse.</p></section><section class="grid" id="grid"><div class="empty">A carregar pedidos…</div></section></main><footer class="footer">Electro Mais Moçambique · Onde a Energia Encontra a Qualidade.</footer><script type="module">const firebaseConfig={apiKey:'AIzaSyBR3l3CxiWXv7ZEriIMo833p8oWJ_mTw74',authDomain:'electro-mais-mocambique.firebaseapp.com',projectId:'electro-mais-mocambique',storageBucket:'electro-mais-mocambique.firebasestorage.app',messagingSenderId:'620596361441',appId:'1:620596361441:web:fadde283aa7978c2585fa0',measurementId:'G-YNYY117RKE'};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,query,where,getDocs,updateDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const label=s=>({novo:'Novo',aguardando_avaliacao:'Aguardando avaliação',aceite:'Aceite',accepted:'Aceite',recusado:'Recusado',refused:'Recusado',em_execucao:'Em execução',concluido:'Concluído',completed:'Concluído'}[s]||s||'Novo');onAuthStateChanged(auth,async u=>{if(!u){location.replace('index.html#minha-conta');return}let role='cliente';try{const p=await getDoc(doc(db,'users',u.uid));role=p.exists()?p.data().role||'cliente':'cliente'}catch(e){}try{let docs=[];if(role==='eletricista'){const a=await getDocs(query(collection(db,'serviceRequests'),where('technicianId','==',u.uid)));docs=a.docs;const b=await getDocs(query(collection(db,'serviceRequests'),where('technicianId','==',null),where('status','==','novo')));docs=[...new Map([...docs,...b.docs].map(d=>[d.id,d])).values()]}else{const a=await getDocs(query(collection(db,'serviceRequests'),where('clientUid','==',u.uid)));docs=a.docs}const rows=docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));document.getElementById('grid').innerHTML=rows.map(x=>`<article class="card"><span class="tag">${x.urgent?'🚨 Urgente · ':''}${esc(label(x.status))}</span><h3>${esc(x.title||x.service||'Pedido de serviço')}</h3><p>${esc(x.description||'')}</p><p class="muted">📍 ${esc(x.location||'Localização não indicada')}</p><p class="muted">${esc(x.createdAt||'')}</p>${role==='eletricista'&&x.status==='novo'?`<div class="actions"><button class="btn primary" onclick="acceptReq('${x.id}')">Aceitar</button><button class="btn outline" onclick="refuseReq('${x.id}')">Recusar</button></div>`:''}</article>`).join('')||'<div class="empty">Ainda não existem pedidos para apresentar.</div>'}catch(e){console.error(e);document.getElementById('grid').innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>'}});window.acceptReq=async id=>{try{await updateDoc(doc(db,'serviceRequests',id),{technicianId:auth.currentUser.uid,status:'aceite',updatedAt:new Date().toISOString()});location.reload()}catch(e){alert('Não foi possível aceitar o pedido.')}};window.refuseReq=async id=>{try{await updateDoc(doc(db,'serviceRequests',id),{status:'recusado',updatedAt:new Date().toISOString()});location.reload()}catch(e){alert('Não foi possível recusar o pedido.')}};</script></body></html>
