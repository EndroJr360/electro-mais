<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Área — Electro Mais</title><style>:root{--o:#f58220;--d:#111827;--m:#667085;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:#172033}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px}.top a{display:flex;align-items:center;gap:12px}.top img{width:48px;height:48px;object-fit:contain}.top b{font-size:20px}.top span{display:block;color:#d9862c;font-size:12px}.wrap{max-width:1050px;margin:auto;padding:30px 18px 70px}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:35px;margin:0 0 8px}.hero p{color:var(--m);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:20px;box-shadow:0 10px 25px rgba(16,24,40,.05)}.stat b{font-size:30px;display:block;color:var(--o)}.stat span{color:var(--m)}.card{margin-top:16px}.card h2{margin-top:0}.request{border:1px solid #e6e8ec;border-radius:17px;padding:16px;margin:10px 0;background:#fafbfc}.request h3{margin:0 0 6px}.muted{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.outline{background:#fff;border:1px solid #d9dee7}.back{display:inline-flex;margin-top:20px;padding:11px 16px;border-radius:999px;background:#fff;border:1px solid #e4e7ec;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:24px 13px 55px}}</style></head><body><header class="top"><a href="minha-conta.html"><img src="https://endrojr360.github.io/electro-mais/assets/logo.png" onerror="this.style.display='none'"><div><b>ELECTRO MAIS</b><span>ONDE A ENERGIA ENCONTRA A QUALIDADE</span></div></a></header><main class="wrap"><section class="hero"><h1 id="title">Minha Área</h1><p id="subtitle">Acompanhe pedidos, mensagens e atividade da sua conta.</p></section><div id="stats" class="grid"><div class="stat"><b>—</b><span>Pedidos</span></div><div class="stat"><b>—</b><span>Em andamento</span></div><div class="stat"><b>—</b><span>Concluídos</span></div></div><section class="card"><h2>Pedidos de serviço</h2><div id="requests" class="muted">A carregar…</div></section><section class="card"><h2>Acesso rápido</h2><div class="actions"><a class="btn primary" href="mensagens.html">💬 Mensagens</a><a class="btn outline" href="editar-perfil.html">👤 Editar perfil</a><a class="btn outline" href="seguranca-conta.html">🔐 Segurança</a><a class="btn outline" href="index.html">Explorar Electro Mais</a></div></section><a class="back" href="minha-conta.html">← Voltar à Minha Conta</a></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,collection,getDocs,query,where,doc,getDoc,updateDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';const c={apiKey:'AIzaSyBR3l3CxiWXv7ZEriIMo833p8oWJ_mTw74',authDomain:'electro-mais-mocambique.firebaseapp.com',projectId:'electro-mais-mocambique',storageBucket:'electro-mais-mocambique.firebasestorage.app',messagingSenderId:'620596361441',appId:'1:620596361441:web:fadde283aa7978c2585fa0',measurementId:'G-YNYY117RKE'},app=initializeApp(c),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const label=s=>({novo:'Novo pedido',aguardando_avaliacao:'Aguardando técnico',aceite:'Aceite',accepted:'Aceite',recusado:'Recusado',refused:'Recusado',em_execucao:'Em execução',concluido:'Concluído',completed:'Concluído'}[s]||s||'Novo');
onAuthStateChanged(auth,async u=>{if(!u){location.replace('index.html#minha-conta');return}let role='cliente';try{const me=await getDoc(doc(db,'users',u.uid));role=me.exists()?me.data()?.role||'cliente':'cliente'}catch(e){}if(role==='eletricista'){$('#title').textContent='Área do Eletricista';$('#subtitle').textContent='Avalie pedidos, converse com clientes e acompanhe os seus serviços.'}try{let docs=[];if(role==='eletricista'){const a=await getDocs(query(collection(db,'serviceRequests'),where('technicianId','==',u.uid)));docs=a.docs;const b=await getDocs(query(collection(db,'serviceRequests'),where('technicianId','==',null),where('status','==','novo')));docs=[...new Map([...docs,...b.docs].map(d=>[d.id,d])).values()]}else{const a=await getDocs(query(collection(db,'serviceRequests'),where('clientUid','==',u.uid)));docs=a.docs}const rows=docs.map(d=>({id:d.id,...d.data()}));const done=rows.filter(x=>['concluido','completed'].includes(x.status)).length;const active=rows.filter(x=>!['concluido','completed','recusado','refused'].includes(x.status)).length;$('#stats').innerHTML=`<div class="stat"><b>${rows.length}</b><span>Pedidos</span></div><div class="stat"><b>${active}</b><span>Em andamento</span></div><div class="stat"><b>${done}</b><span>Concluídos</span></div>`;$('#requests').innerHTML=rows.length?rows.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).map(x=>`<article class="request"><h3>${esc(x.title||x.service||'Pedido de serviço')}</h3><div class="muted">${esc(x.description||'Sem descrição')}</div><p><b>Estado:</b> ${esc(label(x.status))}</p>${role==='eletricista'&&x.status==='novo'?`<div class="actions"><button class="btn primary" onclick="acceptReq('${x.id}')">Aceitar</button><button class="btn outline" onclick="refuseReq('${x.id}')">Recusar</button></div>`:''}</article>`).join(''):'<p class="muted">Ainda não existem pedidos para apresentar.</p>'}catch(e){console.error(e);$('#requests').innerHTML='<p class="muted">Não foi possível carregar os pedidos neste momento.</p>'}});window.acceptReq=async id=>{try{await updateDoc(doc(db,'serviceRequests',id),{technicianId:auth.currentUser.uid,status:'aceite',updatedAt:new Date().toISOString()});location.reload()}catch(e){alert('Não foi possível aceitar o pedido.')}};window.refuseReq=async id=>{try{await updateDoc(doc(db,'serviceRequests',id),{status:'recusado',updatedAt:new Date().toISOString()});location.reload()}catch(e){alert('Não foi possível recusar o pedido.')}};
</script></body></html>
