name: Publicar dica diária Electro Mais

on:
  schedule:
    # 06:00 em Moçambique (UTC+2), todos os dias
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-daily-tip:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependências
        run: npm install --omit=dev
      - name: Publicar dica do dia no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run publish:daily
