import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBR3l3CxiWXv7ZEriIMo833p8oWJ_mTw74',authDomain:'electro-mais-mocambique.firebaseapp.com',projectId:'electro-mais-mocambique',storageBucket:'electro-mais-mocambique.firebasestorage.app',messagingSenderId:'620596361441',appId:'1:620596361441:web:fadde283aa7978c2585fa0',measurementId:'G-YNYY117RKE'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
onAuthStateChanged(auth,async u=>{if(!u){location.replace('index.html#minha-conta');return}let p={role:'cliente',name:u.displayName||u.email||'Utilizador',email:u.email||'',photoURL:u.photoURL||''};try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists())p={...p,...s.data()}}catch(e){console.warn(e)}const role=p.role||'cliente';$('#app').innerHTML=`<section class="card"><div class="account-head"><div class="avatar">${p.photoURL?`<img src="${esc(p.photoURL)}">`:'👤'}</div><div><h2>${esc(p.name||u.displayName||'Utilizador')}</h2><p>${esc(p.email||u.email||'')}</p><span class="badge">${role==='eletricista'?'Eletricista':role==='vendedor'?'Vendedor / Empresa':role==='admin'?'Administrador':'Cliente'}</span></div></div></section><section class="card"><div class="grid"><a class="action" href="editar-perfil.html"><div class="icon">👤</div><strong>Meu perfil${role==='eletricista'?' profissional':''}</strong><small>Editar todos os dados públicos e profissionais do seu perfil.</small></a><a class="action" href="minha-area.html"><div class="icon">📊</div><strong>Minha área</strong><small>Pedidos, mensagens e atividade da sua conta.</small></a><a class="action" href="seguranca-conta.html"><div class="icon">🔐</div><strong>Segurança da conta</strong><small>Acesso, palavra-passe e recuperação da conta.</small></a><a class="action" href="mensagens.html"><div class="icon">💬</div><strong>Mensagens</strong><small>Abra a página própria das suas conversas.</small></a><a class="action" href="index.html#favoritos"><div class="icon">♡</div><strong>Favoritos</strong><small>Consulte os profissionais, produtos e conteúdos guardados.</small></a><button id="logout" class="action danger" style="text-align:left"><div class="icon">🚪</div><strong>Sair da conta</strong><small>Encerrar a sessão neste dispositivo.</small></button></div></section><div class="center"><a class="back" href="index.html">← Voltar ao Electro Mais</a></div>`;$('#logout').onclick=async()=>{if(confirm('Deseja sair da sua conta?')){await signOut(auth);location.replace('index.html')}}});
