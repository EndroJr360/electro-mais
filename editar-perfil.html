<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar Perfil — Electro Mais</title><style>
:root{--o:#f58220;--d:#111827;--m:#667085;--bg:#f5f7f9;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:#172033}.top{height:72px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 20px}.top a{display:flex;align-items:center;gap:12px}.top img{width:48px;height:48px;object-fit:contain}.top b{font-size:20px}.top span{display:block;color:#d9862c;font-size:12px}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:var(--m);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 12px 28px rgba(16,24,40,.05)}.section-title{margin:0 0 16px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid #d9dee7;border-radius:13px;padding:12px 13px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.avatar-row{display:flex;align-items:center;gap:18px}.avatar{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#fff2e4;border:2px solid #ffd8b2;display:grid;place-items:center;font-size:36px}.avatar img{width:100%;height:100%;object-fit:cover}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.outline{background:#fff;border:1px solid #d9dee7}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{margin-top:12px;padding:12px;border-radius:12px;display:none}.ok{display:block;background:#ecfdf3;color:#087443}.err{display:block;background:#fff1f2;color:#b42318}.hint{color:var(--m);font-size:13px;margin-top:5px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:24px 13px 55px}.hero h1{font-size:29px}}
</style></head><body><header class="top"><a href="minha-conta.html"><img src="https://endrojr360.github.io/electro-mais/assets/logo.png" onerror="this.style.display='none'"><div><b>ELECTRO MAIS</b><span>ONDE A ENERGIA ENCONTRA A QUALIDADE</span></div></a></header><main class="wrap"><section class="hero"><h1>Editar perfil</h1><p>Atualize as informações que podem aparecer no seu perfil público.</p></section><div id="loading" class="card">A carregar o perfil…</div><form id="form" class="hidden"><section class="card"><h2 class="section-title">Identidade e contacto</h2><div class="avatar-row"><div class="avatar" id="avatarBox">👤</div><div><input id="photo" type="file" accept="image/*"><div class="hint">A foto será guardada no seu perfil.</div></div></div><div class="grid" style="margin-top:18px"><label>Nome<input id="name" required></label><label>Nome profissional<input id="professionalName"></label><label>Contacto<input id="phone" type="tel"></label><label>Localização<input id="location"></label><label>Bio<textarea id="bio"></textarea></label><label>Redes sociais<textarea id="socials" placeholder="Instagram, Facebook, LinkedIn, etc."></textarea></label></div></section><section id="professional" class="card hidden"><h2 class="section-title">Informações profissionais</h2><div class="grid"><label>Especialidade<input id="specialty"></label><label>Experiência<input id="experience" placeholder="Ex.: 5 anos"></label><label>Serviços oferecidos<textarea id="servicesOffered"></textarea></label><label>Área de atendimento<input id="serviceArea"></label><label>Disponibilidade / horário<input id="availability"></label><label>Atendimento de emergência<select id="emergency"><option value="">Não indicado</option><option value="sim">Sim</option><option value="nao">Não</option></select></label><label>Formação<textarea id="training"></textarea></label><label>Certificações<textarea id="certifications"></textarea></label><label>Equipamentos<textarea id="equipment"></textarea></label><label>Métodos de pagamento<textarea id="paymentMethods"></textarea></label><label>Idiomas<textarea id="languages"></textarea></label><label>Portfólio<textarea id="portfolio"></textarea></label></div></section><section id="seller" class="card hidden"><h2 class="section-title">Dados da loja / empresa</h2><div class="grid"><label>Nome da loja / empresa<input id="storeName"></label><label>Categoria<input id="category"></label><label>Descrição<textarea id="description"></textarea></label><label>Contacto da loja<input id="storePhone" type="tel"></label><label>Tenho loja física<select id="physicalStore"><option value="false">Não</option><option value="true">Sim</option></select></label><label>Endereço<input id="address"></label><label>Bairro<input id="district"></label><label>Cidade<input id="city"></label><label>Província<input id="province"></label><label>Horário<input id="hours"></label><label>Métodos de pagamento<textarea id="sellerPayments"></textarea></label></div></section><section class="card"><div class="actions"><button class="btn primary" type="submit">💾 Guardar alterações</button><a class="btn outline" href="minha-conta.html">← Voltar à Minha Conta</a></div><div id="msg" class="msg"></div></section></form></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js';
const firebaseConfig={apiKey:'AIzaSyBR3l3CxiWXv7ZEriIMo833p8oWJ_mTw74',authDomain:'electro-mais-mocambique.firebaseapp.com',projectId:'electro-mais-mocambique',storageBucket:'electro-mais-mocambique.firebasestorage.app',messagingSenderId:'620596361441',appId:'1:620596361441:web:fadde283aa7978c2585fa0',measurementId:'G-YNYY117RKE'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);let user,role='cliente',existing={};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const set=(id,v)=>$(id).value=v??'';const val=id=>$(id).value.trim();const showMsg=(t,ok=true)=>{const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')};
onAuthStateChanged(auth,async u=>{if(!u){location.replace('index.html#minha-conta');return}user=u;try{const us=await getDoc(doc(db,'users',u.uid));existing=us.exists()?us.data():{};role=existing.role||'cliente';const ts=await getDoc(doc(db,'technicians',u.uid));if(ts.exists())existing={...existing,...ts.data()};if(role==='vendedor'){const vs=await getDoc(doc(db,'vendors',u.uid));if(vs.exists())existing={...existing,...vs.data()}}populate();$('loading').classList.add('hidden');$('form').classList.remove('hidden')}catch(e){console.error(e);$('loading').textContent='Não foi possível carregar o seu perfil.'}});
function populate(){set('name',existing.name||user.displayName||'');set('professionalName',existing.professionalName||existing.title||'');set('phone',existing.phone||'');set('location',existing.location||'');set('bio',existing.bio||'');set('socials',existing.socials||existing.socialLinks||'');if(existing.photoURL)$('avatarBox').innerHTML=`<img src="${esc(existing.photoURL)}">`;if(role==='eletricista'){ $('professional').classList.remove('hidden');['specialty','experience','servicesOffered','serviceArea','availability','emergency','training','certifications','equipment','paymentMethods','languages','portfolio'].forEach(k=>set(k,existing[k]||''))}if(role==='vendedor'||role==='empresa'){ $('seller').classList.remove('hidden');set('storeName',existing.storeName||existing.name||'');set('category',existing.category||'');set('description',existing.description||'');set('storePhone',existing.phone||'');set('physicalStore',String(!!existing.physicalStore));set('address',existing.address||'');set('district',existing.district||'');set('city',existing.city||'');set('province',existing.province||'');set('hours',existing.hours||'');set('sellerPayments',Array.isArray(existing.paymentMethods)?existing.paymentMethods.join(', '):existing.paymentMethods||'')}}
$('photo').onchange=async()=>{const f=$('photo').files[0];if(!f||!user)return;showMsg('A enviar a nova foto…',true);try{const r=ref(storage,`profiles/${user.uid}/profile-${Date.now()}`);await uploadBytes(r,f,{contentType:f.type});const url=await getDownloadURL(r);existing.photoURL=url;$('avatarBox').innerHTML=`<img src="${esc(url)}">`;showMsg('Foto carregada. Guarde as alterações para confirmar o perfil.',true)}catch(e){console.error(e);showMsg('Não foi possível enviar a foto.',false)}};
$('form').onsubmit=async e=>{e.preventDefault();if(!user)return;try{const common={uid:user.uid,name:val('name'),professionalName:val('professionalName'),phone:val('phone'),location:val('location'),bio:val('bio'),socials:val('socials'),photoURL:existing.photoURL||user.photoURL||'',updatedAt:new Date().toISOString()};await setDoc(doc(db,'users',user.uid),common,{merge:true});if(role==='eletricista'){await setDoc(doc(db,'technicians',user.uid),{...common,specialty:val('specialty'),experience:val('experience'),servicesOffered:val('servicesOffered'),serviceArea:val('serviceArea'),availability:val('availability'),emergency:val('emergency'),training:val('training'),certifications:val('certifications'),equipment:val('equipment'),paymentMethods:val('paymentMethods'),languages:val('languages'),portfolio:val('portfolio')},{merge:true})}else if(role==='vendedor'||role==='empresa'){await setDoc(doc(db,'vendors',user.uid),{uid:user.uid,name:val('storeName')||common.name,category:val('category'),description:val('description'),phone:val('storePhone')||common.phone,physicalStore:$('physicalStore').value==='true',address:val('address'),district:val('district'),city:val('city'),province:val('province'),hours:val('hours'),paymentMethods:val('sellerPayments').split(',').map(x=>x.trim()).filter(Boolean),logoURL:common.photoURL,updatedAt:new Date().toISOString()},{merge:true})}showMsg('Perfil atualizado com sucesso. ✅',true);setTimeout(()=>location.href='minha-conta.html',900)}catch(e){console.error(e);showMsg('Não foi possível guardar as alterações. Verifique a ligação e as permissões da conta.',false)}};
</script></body></html>
